[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "robotevalops"
version = "0.1.0"
description = "Reproducible robot-policy evaluation, teleoperation data QA, and experiment artifact management."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "opencv-python-headless>=4.9",
  "jinja2>=3.1",
  "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
sim = ["pybullet>=3.2.6"]
s3 = ["boto3>=1.34"]
dashboard = ["streamlit>=1.35"]
# LeRobot is intentionally NOT pinned/locked here; see docs/hardware-setup.md.
lerobot = ["lerobot"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "moto[s3]>=5",
  "boto3>=1.34",
  "types-PyYAML",
  "pandas-stubs",
]

[project.scripts]
robotevalops = "robotevalops.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robotevalops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "physics: requires the pybullet extra (separate smoke job)",
  "s3_real: opt-in real AWS test; never run in CI",
  "hardware: requires a physical robot; never run in CI",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer.Option defaults

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
