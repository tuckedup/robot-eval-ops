# Smoke evaluation on the MOCK fixture backend: 2 controllers x 3 conditions x 2 trials = 12 planned trials.
# Mock output is fixture data, never robotics performance evidence.
name: eval_smoke_mock
provenance: mock
backend: mock
trials_per_condition: 2
base_seed: 1234
task:
  task_id: pick_place_block_v1
  attempt_timeout_s: 30.0
  dwell_required_s: 2.0
controllers_from: configs/controllers/mock_scripted.yaml
conditions_from: configs/conditions/mock_conditions.yaml
