# Scripted (NOT learned) controllers for the PyBullet Panda pick-place sim (backend: pybullet_panda).
# A config here is a parameter set for src/robotevalops/controllers/scripted_pick_place.py, not a
# trained checkpoint. They read simulator STATE (block pose), not pixels, so they are not expected
# to react to visual-only conditions; results say nothing about learned-policy robustness.
# Units: metres, seconds (speeds m/s, joint_speed_limit rad/s), newtons.
# Measured success per condition from a real local run is recorded in docs/hardware-setup.md
# section "Simulation results (local run)" and in the robotics handoff report; do not quote
# numbers from this file.
- controller_id: scripted_baseline_a
  type: scripted
  version: "1"
  config:
    hover_z: 0.20
    lift_z: 0.22
    grasp_z: 0.020
    move_speed: 0.20
    descend_speed: 0.08
    joint_speed_limit: 1.2
    grip_force: 20.0
  description: >-
    Baseline A v1: conservative speeds (0.20 m/s transit, 0.08 m/s vertical), 20 N grip force,
    20 cm hover height.
- controller_id: scripted_baseline_b
  type: scripted
  version: "1"
  config:
    hover_z: 0.28
    lift_z: 0.28
    grasp_z: 0.020
    move_speed: 0.35
    descend_speed: 0.15
    joint_speed_limit: 1.6
    grip_force: 12.0
    close_settle_steps: 6
  description: >-
    Baseline B v1: higher hover/lift height (28 cm), faster speeds (0.35 m/s transit, 0.15 m/s
    vertical), lower grip force (12 N).
