# Physics-stress conditions for the PyBullet Panda pick-place sim (backend: pybullet_panda).
# Every condition is kind: physics_stress: the SEEDED +-4 cm block-position draw of `object_position`
# (same stream, so seed k gives the same start offset) PLUS the named physical factor(s) at a bounded level.
# Factors not named stay nominal. Bounds are clamped in code (adapters/sim_pybullet.py STRESS_BOUNDS).
# These change PHYSICS or the controller's observation/actuation, not pixels. No success flag is touched:
# success is still decided by simulator evidence only. Scripted controllers only; nothing here is learned.
- name: stress_nominal
  kind: physics_stress
  version: '1'
  params: {}
  affects_controller_state: true
  description: family=reference
- name: mass_0.2kg
  kind: physics_stress
  version: '1'
  params:
    block_mass_kg: 0.2
  affects_controller_state: true
  description: family=mass
